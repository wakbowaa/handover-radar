<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Handover Radar</title><style>:root{--n:#061019;--g:#9dff72;--a:#ffb62f;--c:#cde8d2}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--c);font:14px monospace;overflow-x:hidden}.bar{padding:18px 3vw;display:flex;justify-content:space-between;border-bottom:1px solid #9dff7244}.bar button,.btn{background:transparent;border:1px solid var(--g);color:var(--g);padding:11px}.screen{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 62px)}.radar{display:grid;place-items:center;border-right:1px solid #9dff7244;position:relative;background:repeating-radial-gradient(circle,#9dff7209 0 55px,#9dff7230 56px 57px)}.disc{width:min(65vw,520px);aspect-ratio:1;border:1px solid var(--g);border-radius:50%;position:relative;overflow:hidden}.disc:after{content:'';position:absolute;width:50%;height:2px;background:var(--g);top:50%;left:50%;transform-origin:left;animation:sweep 4s linear infinite;box-shadow:0 0 18px var(--g)}@keyframes sweep{to{transform:rotate(360deg)}}.blip{position:absolute;padding:7px;background:var(--n);border:1px solid var(--a);color:var(--a);font-size:10px}.panel{padding:5vw;max-height:calc(100vh - 62px);overflow:auto}h1{font:900 clamp(45px,7vw,90px)/.8 Arial;margin:20px 0;color:white}label{display:block;color:var(--g);font-size:10px;margin-top:15px}input,textarea{width:100%;background:#0b1b25;border:0;border-bottom:1px solid #557263;color:white;padding:11px;font:13px monospace}textarea{min-height:110px}.actions{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.primary{background:var(--g);color:var(--n)}#status{padding:12px;border-left:4px solid var(--a);background:#ffffff08}.row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #294232}.CLEAR{color:var(--g)}.THIN,.MISSING{color:var(--a)}@media(max-width:800px){.screen{display:block}.radar{min-height:420px;border-right:0}.panel{max-height:none}}</style></head><body><header class="bar"><b>HANDOVER RADAR / WATCH DESK</b><button id="connect">CONNECT WALLET</button></header><main class="screen"><section class="radar"><div class="disc" id="disc"></div></section><section class="panel"><small>OUTGOING SHIFT · CRITICAL COVERAGE</small><h1>Scan what<br>was left<br>unsaid.</h1><label>WATCH ID</label><input id="id"><label>STATION</label><input id="station" placeholder="North operations desk"><label>SHIFT</label><input id="shift" placeholder="Night to morning"><label>CRITICAL TOPICS · ONE PER LINE</label><textarea id="topics"></textarea><label>HANDOVER REPORT</label><textarea id="report"></textarea><label>PATCH NOTE · ONLY AFTER GAPS</label><textarea id="patch"></textarea><div class="actions"><button class="btn primary" id="open">OPEN WATCH</button><button class="btn" id="scan">SCAN</button><button class="btn" id="patchBtn">PATCH GAPS</button></div><div id="status">Connect a wallet and open a fresh watch.</div><div id="rows"></div></section></main><script type="module">import{createAccount,createClient}from'https://esm.sh/genlayer-js@1.1.8';import{studionet}from'https://esm.sh/genlayer-js@1.1.8/chains';const A='0x62Fcf6b2425f687ab914f2687646D6Aea23018ad',E='https://studio.genlayer.com/api',$=s=>document.querySelector(s),reader=createClient({chain:studionet,endpoint:E,account:createAccount()});let c;$('#id').value='WATCH-'+Date.now().toString().slice(-8);const lines=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean),note=x=>$('#status').textContent=x;async function connect(){const[a]=await ethereum.request({method:'eth_requestAccounts'});if(String(await ethereum.request({method:'eth_chainId'})).toLowerCase()!=='0xf22f')await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0xf22f'}]});c=createClient({chain:studionet,endpoint:E,account:a,provider:ethereum});$('#connect').textContent=a.slice(0,6)+'…'+a.slice(-4)}$('#connect').onclick=()=>connect().catch(e=>note(e.message));async function send(fn,args){if(!c)await connect();const h=await c.writeContract({address:A,functionName:fn,args,value:0n});note('SUBMITTED · WAITING FINALIZED');await c.waitForTransactionReceipt({hash:h,status:'FINALIZED',retries:180,interval:5000});note('FINALIZED · '+fn)}async function read(){const r=await reader.readContract({address:A,functionName:'get_watch',args:[$('#id').value]});$('#rows').innerHTML=r.coverage.map(x=>'<div class="row"><span>'+x.topic+'</span><b class="'+x.status+'">'+x.status+'</b></div>').join('');$('#disc').innerHTML=r.coverage.map((x,i)=>'<span class="blip" style="left:'+(20+i*11)%+';top:'+(25+(i%3)*20)+'%">'+x.topic+' · '+x.status+'</span>').join('');note(r.state+' · SCAN '+r.scans+'/3')}$('#open').onclick=()=>send('open_watch',[$('#id').value,$('#station').value,$('#shift').value,JSON.stringify(lines('#topics')),$('#report').value]).catch(e=>note(e.message));$('#scan').onclick=()=>send('scan',[$('#id').value]).then(read).catch(e=>note(e.message));$('#patchBtn').onclick=()=>send('patch',[$('#id').value,$('#patch').value]).catch(e=>note(e.message));</script></body></html>
